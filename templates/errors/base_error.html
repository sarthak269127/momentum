<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error – Momentum</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#081120;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
    .logo{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:#5b5cff;border-radius:10px;font-weight:700;font-size:1.4rem;color:#fff;margin-bottom:20px}
    h1{font-size:5rem;font-weight:700;color:#5b5cff;line-height:1}
    h2{font-size:1.4rem;margin:12px 0 8px}
    p{color:#94a3b8;margin-bottom:24px}
    a{display:inline-block;padding:10px 22px;background:#5b5cff;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem}
    a:hover{background:#4a4bdd}
  </style>
</head>
<body>
  <div>
    <div class="logo">M</div><br>
    {% block content %}{% endblock %}
    <a href="/">← Back to Momentum</a>
  </div>
</body>
</html>
