{% extends "auth/auth_layout.html" %}
{% block title %}Login – Momentum{% endblock %}

{% block content %}
<div class="auth-title">Welcome back</div>
<div class="auth-subtitle">Sign in to your account</div>

<form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="auth-field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
  </div>

  <div class="auth-field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
  </div>

  <div class="auth-remember">
    <label>
      <input type="checkbox" name="remember"> Remember me
    </label>
    <a href="{{ url_for('auth.forgot_password') }}" class="auth-forgot">Forgot password?</a>
  </div>

  <button type="submit" class="auth-submit">Sign In</button>
</form>

<div class="auth-footer">
  Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a>
</div>
{% endblock %}
