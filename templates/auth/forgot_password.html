{% extends "auth/auth_layout.html" %}
{% block title %}Forgot Password – Momentum{% endblock %}

{% block content %}
<div class="auth-title">Reset password</div>
<div class="auth-subtitle">We'll send a reset link to your email</div>

<form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="auth-field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
  </div>
  <button type="submit" class="auth-submit">Send Reset Link</button>
</form>

<div class="auth-footer">
  <a href="{{ url_for('auth.login') }}">← Back to login</a>
</div>
{% endblock %}
