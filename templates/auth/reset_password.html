{% extends "auth/auth_layout.html" %}
{% block title %}Reset Password – Momentum{% endblock %}

{% block content %}
<div class="auth-title">New password</div>
<div class="auth-subtitle">Choose a strong password</div>

<form method="POST" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="auth-field">
    <label for="password">New Password</label>
    <input type="password" id="password" name="password" placeholder="Min. 6 characters"
           required minlength="6" autocomplete="new-password">
  </div>
  <button type="submit" class="auth-submit">Update Password</button>
</form>
{% endblock %}
