{% extends "auth/auth_layout.html" %}
{% block title %}Register – Momentum{% endblock %}

{% block content %}
<div class="auth-title">Create account</div>
<div class="auth-subtitle">Start building better habits today</div>

<form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="auth-field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="yourname"
           value="{{ username or '' }}" required autocomplete="username" minlength="2" maxlength="100">
  </div>

  <div class="auth-field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com"
           value="{{ email or '' }}" required autocomplete="email">
  </div>

  <div class="auth-field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Min. 6 characters"
           required autocomplete="new-password" minlength="6">
  </div>

  <button type="submit" class="auth-submit">Create Account</button>
</form>

<div class="auth-footer">
  Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
</div>
{% endblock %}
